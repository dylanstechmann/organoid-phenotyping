[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-phenotyping"
version = "0.1.0"
description = "Source-traceable organoid mask measurements and grouped longitudinal reports"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]
license = { text = "MIT" }

[project.scripts]
organoid-phenotyping = "organoidphenotyping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

